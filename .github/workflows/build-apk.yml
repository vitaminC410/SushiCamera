name: Build Sushi Camera APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded SushiCamera archive
        shell: bash
        run: |
          if [[ -f SushiCamera-GitHub-Actions.zip ]]; then
            unzip -q SushiCamera-GitHub-Actions.zip
            cp -a SushiCamera/. .
          elif [[ -f SushiCamera-source.zip ]]; then
            unzip -q SushiCamera-source.zip
            cp -a SushiCamera/. .
          elif [[ ! -f app/build.gradle ]]; then
            echo "::error::Upload SushiCamera-GitHub-Actions.zip to the repository root, or commit the Android project source files."
            exit 1
          fi
          test -f app/src/main/AndroidManifest.xml
      - name: Apply v0.2 pro UI enhancements
        shell: bash
        run: |
          set -euo pipefail
          base64 -d enhancements/pro-v02.patch.gz.b64 | gzip -dc | patch -p1 --batch --fuzz=0
          grep -q "versionName '0.2.0'" app/build.gradle
      - name: Apply v0.3 photo-processing enhancements
        shell: bash
        run: |
          set -euo pipefail
          base64 -d enhancements/pro-v03-processing.patch.gz.b64 | gzip -dc | patch -p1 --batch --fuzz=0
          grep -q "versionName '0.3.0'" app/build.gradle
      - name: Apply v0.4 iOS-style interface
        shell: bash
        run: |
          set -euo pipefail
          base64 -d enhancements/pro-v04-ios-ui.patch.gz.b64 | gzip -dc | patch -p1 --batch --fuzz=0
          grep -q "versionName '0.4.0'" app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SushiCamera-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
